[project]
name = "ai-me"
version = "0.1.0"
description = "Personalized conversational AI agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "langgraph>=0.6,<1",
  "playwright>=1.50,<2",
  "python-dotenv>=1.0,<2",
  "qdrant-client>=1.14,<2",
  "sentence-transformers>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
